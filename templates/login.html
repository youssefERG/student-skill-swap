{% extends "base.html" %}

{% block title %}Log in — StudentSkillSwap{% endblock %}

{% block content %}
<section class="form-page">
  <div class="form-card">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Log in</h1>
    <p class="form-intro">Continue exchanging programming knowledge.</p>

    <form method="post" class="stacked-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button class="button button-dark button-full" type="submit">Log in</button>
    </form>

    <p class="form-switch">New to StudentSkillSwap? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
