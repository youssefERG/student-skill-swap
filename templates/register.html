{% extends "base.html" %}

{% block title %}Create account — StudentSkillSwap{% endblock %}

{% block content %}
<section class="form-page">
  <div class="form-card">
    <p class="eyebrow">JOIN THE COMMUNITY</p>
    <h1>Create your account</h1>
    <p class="form-intro">Make an account, then choose your programming and IT skills.</p>

    <form method="post" class="stacked-form">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" maxlength="80" autocomplete="name" required>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      <p class="field-help">Use at least 8 characters.</p>

      <button class="button button-dark button-full" type="submit">Create account</button>
    </form>

    <p class="form-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
